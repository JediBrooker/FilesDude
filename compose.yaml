# FilesDude with Docker Compose. Put this file in a folder of its own, then:
#
#   docker compose run --rm filesdude setup    # choose the login
#   docker compose up -d
#
# and open http://localhost:3000 on this machine (see the README for HTTPS and remote access).
# Updates: docker compose pull && docker compose up -d
services:
  filesdude:
    # The latest release. To stay on one release, name it (for example :0.3.0), or :0.3 for its fixes
    # only; :main has every change as it's merged. To build from a copy of the repository instead,
    # replace this line with: build: .
    image: ghcr.io/jedibrooker/filesdude:stable
    container_name: filesdude
    restart: unless-stopped
    init: true
    environment:
      # The user and group FilesDude works as: the owner of your files (`id` shows yours).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # FilesDude is only reachable from this machine (see ports), through your reverse proxy, so the
      # proxy's forwarded address and HTTPS are believed. Set to "false" if you publish the port to
      # your network directly.
      FILEDUDE_TRUST_PROXY: "true"
      # Other settings (see the README), for example:
      # FILEDUDE_MAX_UPLOAD_MB: "2048"
      # FILEDUDE_SHARING_ENABLED: "false"
    volumes:
      # The folder FilesDude manages (FILEDUDE_HOST_ROOT in .env, or ./files beside this file).
      - ${FILEDUDE_HOST_ROOT:-./files}:/data
      # FilesDude's own state: its login, settings, share links, trash records, and caches.
      - filesdude-state:/state
      # To show your system's user and group names for file owners (rather than numbers):
      # - /etc/passwd:/etc/passwd:ro
      # - /etc/group:/etc/group:ro
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Only for handing /state to PUID:PGID as the container starts; FilesDude itself runs without any.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

volumes:
  filesdude-state:
